name: Crowdin Context Sync

# Standalone workflow. Does not modify or depend on the existing "Crowdin Action" workflow.
#
# Runs packages/crowdin/api/syncContext.ts, which sets the Crowdin `context` field on
# org-data strings to a link back to the live organization page, replacing Crowdin's
# auto-generated identifier breadcrumb.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview changes without writing to Crowdin'
        type: boolean
        default: true
      force:
        description: 'Overwrite context even if it is not the auto-generated fallback'
        type: boolean
        default: false
  # Uncomment once confident in the script's behavior after a few manual runs:
  # schedule:
  #   - cron: '0 9 * * *'

jobs:
  sync-context:
    name: Sync Crowdin context field
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        name: Install pnpm

      - name: Install Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --config.engine-strict=false

      - name: Run context sync
        env:
          CROWDIN_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_BASE_URL: 'https://app.inreach.org'
        run: |
          pnpm tsx packages/crowdin/api/syncContext.ts \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}
