name: Test

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  unit:
    name: 'Unit & component tests'
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      FORCE_COLOR: true
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # --ignore-scripts is intentionally not used: it would also skip this workspace's own
      # postinstall hooks (e.g. packages/db's Prisma client generation), not just third-party
      # scripts. Untrusted third-party install scripts are already blocked by pnpm's
      # `onlyBuiltDependencies` allowlist in package.json - see SonarCloud rule
      # githubactions:S6505 (resolved as a deliberate exception, not overlooked).
      - name: Install dependencies
        run: pnpm install

      - name: Run unit & component tests
        run: pnpm --filter @weareinreach/ui test
