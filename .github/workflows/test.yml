name: Test

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  unit:
    name: 'Unit & component tests'
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      FORCE_COLOR: true
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        name: Install pnpm
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # --ignore-scripts is safe here (unlike the other workflows in this repo): this job
      # only runs packages/ui's Vitest suite, which must never need packages/db's
      # postinstall-generated Prisma client - UI code runs in the browser, where Prisma
      # doesn't exist. Any test that crashes with "Cannot find module '.prisma/client/default'"
      # is resolving a server-only entry the real browser bundle never loads (see the
      # `@weareinreach/auth` alias in packages/ui/vitest.config.mts) - fix the resolution,
      # don't add `prisma generate` here. Verified: a clean `pnpm install --ignore-scripts`
      # then `pnpm --filter @weareinreach/ui test` passes with no generated client present.
      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Run unit & component tests
        run: pnpm --filter @weareinreach/ui test
