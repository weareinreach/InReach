---
name: Sync labels

on:
  push:
    branches:
      - dev
    paths:
      - .github/labels.yml

# action-label-syncer creates/updates/deletes repo labels via the default GITHUB_TOKEN, which
# needs `issues: write` (label management lives under the Issues API) - `contents: read` alone
# would let this checkout but fail (403) when it tries to actually sync labels.
permissions:
  contents: read
  issues: write

jobs:
  labels:
    name: ♻️ Sync labels
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: 🚀 Run Label Syncer
        uses: micnncim/action-label-syncer@3abd5ab72fda571e69fffd97bd4e0033dd5f495c # v1.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
